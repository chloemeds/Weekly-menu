<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Menú</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Menú">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra fija con semanas y botón de cambio; debajo un carrusel con un día por pantalla. */
:root{
  --bg:#f6f7f2; --surface:#ffffff; --ink:#1f2a1f; --muted:#5f6b5c; --line:#dfe3d6;
  --accent:#5b7a2e; --accent-ink:#ffffff; --accent-soft:#e8efd9;
  --reg:#3f6e8c; --reg-soft:#e3edf3; --low:#9a5b1e; --low-soft:#f6eadb; --fiesta:#a33d5b; --fiesta-soft:#f6e1e7; --fast:#6a6478; --fast-soft:#ecebf0;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141812; --surface:#1c211a; --ink:#e6eadf; --muted:#9aa492; --line:#2f362b;
  --accent:#a8c97a; --accent-ink:#141812; --accent-soft:#283320;
  --reg:#8dbbd8; --reg-soft:#1d2a33; --low:#e0a46a; --low-soft:#33261a; --fiesta:#e88aa6; --fiesta-soft:#36202a; --fast:#b5afc4; --fast-soft:#26242c;
  color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.top{flex:none;display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.weeks{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.weeks button{font:700 15px var(--display);letter-spacing:.01em;border:0;background:transparent;color:var(--muted);padding:7px 14px;border-radius:999px;cursor:pointer}
.weeks button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.askbtn{font:700 14px var(--body);border:0;border-radius:999px;padding:9px 14px;background:var(--accent-soft);color:var(--accent);cursor:pointer}
.dots{flex:none;display:flex;justify-content:center;gap:6px;padding:2px 16px 8px;flex-wrap:wrap}
.dots button{border:0;background:transparent;padding:4px 6px;font:600 12px var(--body);color:var(--muted);border-radius:999px;cursor:pointer}
.dots button[aria-current="true"]{background:var(--ink);color:var(--bg)}
.car{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;overflow-y:auto;padding:4px max(8px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 12px;display:flex;flex-direction:column;gap:14px;max-width:560px;margin:0 auto}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.dn{font:700 26px/1.1 var(--display);margin:0}
.dn small{font:400 14px var(--body);color:var(--muted);margin-left:6px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
.chip.reg{color:var(--reg);background:var(--reg-soft)} .chip.low{color:var(--low);background:var(--low-soft)}
.chip.fiesta{color:var(--fiesta);background:var(--fiesta-soft)} .chip.fast{color:var(--fast);background:var(--fast-soft)}
.meal{background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:14px;padding:12px}
.meal h3{margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line);font:700 13px var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.meal.fastcell,.meal.loncell{border-left-width:1px}
.meal.fastcell{background:var(--fast-soft)} .meal.loncell{background:var(--reg-soft)}
.dish{font-weight:600;margin:0 0 8px;font-size:15px;line-height:1.3}
ul{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:3px;font-size:14px;color:var(--muted)}
li{display:flex;justify-content:space-between;gap:10px}
li .q{font-family:var(--mono);font-size:13px;color:var(--ink);white-space:nowrap}
.opts li{display:list-item;list-style:disc;margin-left:18px}
.mac{display:flex;flex-wrap:wrap;gap:4px 12px;font-family:var(--mono);font-size:12.5px;color:var(--muted);padding-top:8px;border-top:1px dashed var(--line);font-variant-numeric:tabular-nums}
.mac b{color:var(--ink);font-weight:500}
.fastbox{display:flex;flex-direction:column;gap:6px;color:var(--fast);font-size:14px} .fastbox p{margin:0} .fastbox .ft{font:700 17px var(--display)}
.nt{margin:6px 0 0;font-size:12.5px;color:var(--fast)}
.total{background:var(--accent-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.total h3{margin:0 0 4px;font:600 12px var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.tr{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:baseline;font-variant-numeric:tabular-nums}
.tl{font-size:14px;color:var(--muted)} .tv{font:500 16px var(--mono)} .tg{font:400 12.5px var(--mono);color:var(--muted)}
.pending{max-width:560px;margin:0 auto 10px;font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:8px 12px;white-space:pre-line}
.pending[hidden]{display:none}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;z-index:10}
.sheet[hidden]{display:none}
.panel{background:var(--bg);width:100%;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;max-width:640px;margin:0 auto}
.panel h2{margin:0;font:700 22px var(--display)}
.panel p{margin:0;color:var(--muted);font-size:14px}
.panel select,.panel textarea{font:500 16px var(--body);border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);color:var(--ink);width:100%}
.panel textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:8px;justify-content:flex-end}
.b{font:700 15px var(--body);border-radius:12px;padding:11px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.b.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.cartbtn{margin-left:auto;flex:none;width:42px;height:42px;border-radius:999px;border:0;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;cursor:pointer;padding:0}
.cartbtn svg{width:22px;height:22px}
.cart{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.cart[hidden]{display:none}
.chead{flex:none;display:flex;align-items:center;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.chead h2{margin:0;font:700 20px/1.15 var(--display);flex:1}
.close{flex:none;width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 20px var(--body);cursor:pointer}
.cbody{flex:1;overflow-y:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.cbody>*{max-width:560px;margin-left:auto;margin-right:auto}
.cstat{display:flex;align-items:baseline;gap:8px;font-size:14px;color:var(--muted)}
.cstat b{font:700 22px var(--display);color:var(--ink)} .cstat .eur{margin-left:auto;text-align:right}
.track{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:8px auto 10px} .fill{height:100%;background:var(--accent);width:0;transition:width .25s}
.ctrl{display:flex;gap:8px;flex-wrap:wrap}
.chip2{font:600 13px var(--body);border-radius:999px;padding:7px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip2[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.aisle h3{margin:18px 0 6px;font:700 12px var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.aisle ul{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:0;gap:0;color:var(--ink)}
.aisle li{display:block} .aisle li+li{border-top:1px solid var(--line)}
.aisle label{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;cursor:pointer}
.aisle input{appearance:none;flex:none;width:22px;height:22px;margin:1px 0 0;border:2px solid var(--muted);border-radius:6px;display:grid;place-content:center;cursor:pointer}
.aisle input::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px);opacity:0}
.aisle input:checked{background:var(--accent);border-color:var(--accent)} .aisle input:checked::after{opacity:1}
.it{display:flex;flex-direction:column;min-width:0;flex:1;font-size:15px}
.it .nm{font-weight:700} .it .qt,.it .by{color:var(--muted);font-size:13px} .it .qt em{font-style:normal;color:var(--ink)}
.it .tag{align-self:flex-start;margin-top:4px;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--low-soft);color:var(--low)}
.pr{flex:none;font:500 14px var(--mono);white-space:nowrap}
.aisle li.have .nm,.aisle li.have .qt,.aisle li.have .pr{color:var(--muted);text-decoration:line-through}
.only .aisle li.have{display:none} .only .aisle.allhave{display:none}
.cfoot{margin-top:16px;font-size:13px;color:var(--muted)}
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:30;width:40px;height:40px;margin-left:-20px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.12);display:grid;place-items:center;color:var(--accent);opacity:0;transform:translateY(-60px);pointer-events:none}
.ptr svg{width:20px;height:20px}
.ptr.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.aisle li{display:flex;align-items:center} .aisle label{flex:1;min-width:0}
.mama{flex:none;margin-right:12px;font-size:20px;line-height:1;border-radius:999px;padding:7px 9px;border:1px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer}
.mama[aria-pressed="true"]{background:var(--fiesta-soft);border-color:var(--fiesta);color:var(--fiesta)}
.aisle li.mom .nm::after{content:" · lo compra mamá";font-weight:500;font-size:12.5px;color:var(--fiesta)}
.aisle li.mom .pr{color:var(--muted);text-decoration:line-through}
.only .aisle li.mom{display:none}
.mombar{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--fiesta-soft);color:var(--fiesta);font-size:14px}
.mombar b{font-weight:700} .mombar button{margin-left:auto;font:700 13px var(--body);border:0;border-radius:999px;padding:8px 12px;background:var(--fiesta);color:#fff;cursor:pointer}
.mombar button[disabled]{opacity:.45}
.momlink{margin-top:8px;font-size:12.5px;color:var(--muted);word-break:break-all}
</style>
</head><body>
<div class="top">
  <div class="weeks" id="weeks" role="group" aria-label="Semana"></div>
  <button class="cartbtn" id="cartbtn" type="button" aria-label="Lista de la compra"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2.5 3.5h2.6l2.4 11.2a1.6 1.6 0 0 0 1.6 1.3h8.4a1.6 1.6 0 0 0 1.6-1.2l1.6-7.3H6.1"/></svg></button>
  <button class="askbtn" id="ask" type="button">Pedir un cambio</button>
</div>
<div class="ptr" id="ptr" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4h-4"/></svg></div>
<div class="dots" id="dots"></div>
<p class="pending" id="pending" hidden></p>
<div class="car" id="car"><div class="empty">Cargando el menú…</div></div>

<div class="cart" id="cart" hidden>
  <div class="chead"><h2 id="ctitle">Lista de la compra</h2><button class="close" id="cclose" type="button" aria-label="Cerrar">×</button></div>
  <div class="cbody" id="cbody"></div>
</div>

<div class="sheet" id="sheet" hidden>
  <form class="panel" id="form">
    <h2>Pedir un cambio</h2>
    <p>Cuéntame qué has comido distinto o qué quieres cambiar. Se abrirá GitHub con tu mensaje escrito: solo tienes que tocar <b>Create</b>. En 1 o 2 minutos el día se actualiza solo.</p>
    <label for="day" class="tl">Día</label>
    <select id="day"></select>
    <textarea id="msg" placeholder="Ej.: en la comida he comido 150 g de pollo en vez de 105 g"></textarea>
    <div class="row"><button type="button" class="b" id="cancel">Cancelar</button><button type="submit" class="b primary">Enviar</button></div>
  </form>
</div>

<script>
const VERSION = '12';
fetch('./version.txt', { cache: 'no-store' }).then(r => r.ok ? r.text() : VERSION).then(v => {
  v = v.trim();
  if (v && v !== VERSION && !location.search.includes('v=' + v)) location.replace('./?v=' + v);
}).catch(() => {});

const REPO = 'chloemeds/Weekly-menu';
const $ = id => document.getElementById(id);
let weeks = [], cur = null, now = null, data = {}, idx = 0;
const MONTHS = {ene:0,feb:1,mar:2,abr:3,may:4,jun:5,jul:6,ago:7,sep:8,oct:9,nov:10,dic:11};
function dayDate(d){ const m = /(\d{1,2})\s+([a-z]{3})/i.exec(d.date||''); if(!m) return null; const now = new Date(); return new Date(now.getFullYear(), MONTHS[m[2].toLowerCase()], +m[1]); }
function todayIndex(w){ const t = new Date(); t.setHours(0,0,0,0); const ds = w.days.map(dayDate); let i = ds.findIndex(d => d && d.getTime() === t.getTime()); return i < 0 ? 0 : i; }
async function getJSON(p){ const r = await fetch(p + '?t=' + Date.now(), {cache:'no-store'}); if(!r.ok) throw new Error(p); return r.json(); }
function short(d){ return d.name.slice(0,3); }

function renderWeeks(){
  $('weeks').innerHTML = '';
  for(const w of weeks){ const b = document.createElement('button'); b.type='button'; b.textContent = w; b.setAttribute('aria-pressed', String(w === cur)); b.onclick = () => openWeek(w); $('weeks').append(b); }
}
function renderWeek(){
  const w = data[cur]; const car = $('car'); car.innerHTML=''; $('dots').innerHTML='';
  w.days.forEach((d, i) => {
    const s = document.createElement('section'); s.className='slide'; s.setAttribute('aria-label', d.name + ' ' + d.date);
    let h = '<div class="card"><div class="dayhead"><h2 class="dn">' + d.name + (d.date ? '<small>' + d.date + '</small>' : '') + '</h2><span class="chip ' + d.chip.cls + '">' + d.chip.text + '</span></div>';
    for(const m of d.meals){ const extra = (m.cls||[]).filter(c => c==='fastcell'||c==='loncell').join(' '); const label = m.span > 1 ? 'Desayuno, comida y merienda' : m.meal; h += '<div class="meal ' + extra + '"><h3>' + label + '</h3>' + m.html + '</div>'; }
    if(d.total) h += '<div class="total"><h3>Total del día</h3>' + d.total + '</div>';
    s.innerHTML = h + '</div>'; car.append(s);
    const b = document.createElement('button'); b.type='button'; b.textContent = short(d); b.onclick = () => go(i); $('dots').append(b);
  });
  $('day').innerHTML = w.days.map((d,i) => '<option value="' + i + '">' + d.name + ' ' + d.date + '</option>').join('');
}
function mark(){ [...$('dots').children].forEach((b,i) => b.setAttribute('aria-current', String(i === idx))); }
function go(i, smooth=true){ idx = i; const car = $('car'); car.scrollTo({left: i * car.clientWidth, behavior: smooth ? 'smooth' : 'auto'}); mark(); }
$('car').addEventListener('scroll', () => { const car = $('car'); const i = Math.round(car.scrollLeft / car.clientWidth); if(i !== idx){ idx = i; mark(); } }, {passive:true});
window.addEventListener('resize', () => go(idx, false));
async function openWeek(w){
  cur = w; renderWeeks();
  try{ if(!data[w]) data[w] = await getJSON('data/' + w.toLowerCase() + '.json'); }catch(e){ $('car').innerHTML = '<div class="empty">No he podido cargar ' + w + '. Revisa la conexión.</div>'; return; }
  renderWeek(); requestAnimationFrame(() => go(w === now ? todayIndex(data[w]) : 0, false));
}
let lastPending = 0, pollT = null;
async function loadPending(){
  try{ const r = await fetch('https://api.github.com/repos/' + REPO + '/issues?state=open&per_page=10', { cache: 'no-store' }); if(!r.ok) return; const list = (await r.json()).filter(x => !x.pull_request);
    if(list.length){ $('pending').hidden = false; $('pending').textContent = (list.length === 1 ? 'Aplicando 1 cambio: ' : 'Aplicando ' + list.length + ' cambios: ') + list.map(x => x.title.replace(/^Cambio:\s*/,'')).join(' · ') + '. Tarda 1 o 2 minutos y se actualiza solo.'; }
    else if(lastPending){ const keep = idx; data = {}; await openWeek(cur); requestAnimationFrame(() => requestAnimationFrame(() => go(keep, false)));
      let note = 'Cambio aplicado. Ya tienes el menú actualizado.';
      try{ const c = await fetch('https://api.github.com/repos/' + REPO + '/issues/comments?sort=created&direction=desc&per_page=1', { cache: 'no-store' }).then(r => r.json()); if(c[0] && c[0].body) note = 'Cambio aplicado: ' + c[0].body.split('\n---')[0].trim(); }catch(e){}
      $('pending').hidden = false; $('pending').textContent = note + ' (toca para cerrar)'; $('pending').onclick = () => { $('pending').hidden = true; }; }
    else $('pending').hidden = true;
    lastPending = list.length; clearTimeout(pollT); if(list.length) pollT = setTimeout(loadPending, 20000);
  }catch(e){}
}
document.addEventListener('visibilitychange', () => { if(!document.hidden) loadPending(); });
const eur = v => v.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
async function openCart(){
  const w = cur, body = $('cbody'); $('cart').hidden = false; $('ctitle').textContent = 'Lista de la compra ' + w; body.innerHTML = '<div class="empty">Cargando…</div>';
  let L; try{ L = await getJSON('data/compra-' + w.toLowerCase() + '.json'); }catch(e){ body.innerHTML = '<div class="empty">No hay lista de la compra para ' + w + '.</div>'; return; }
  const KEY = 'compra-' + w; let have = {}; try{ have = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; }catch(e){}
  let only = false; try{ only = localStorage.getItem('compra-only') === '1'; }catch(e){}
  const MKEY = 'mama-' + w; let mom = {}; try{ mom = JSON.parse(localStorage.getItem(MKEY) || '{}') || {}; }catch(e){}
  $('ctitle').textContent = L.title || ('Lista de la compra ' + w);
  let h = '<div class="cstat"><b id="cleft"></b><span id="clbl"></span><span class="eur"><b id="ccost" style="font-size:18px"></b><br>en Mercadona</span></div><div class="track"><div class="fill" id="cfill"></div></div><div class="ctrl"><button type="button" class="chip2" id="conly">Ver solo lo que falta</button><button type="button" class="chip2" id="creset">Desmarcar todo</button></div><div class="mombar"><span>Lista de mamá: <b id="mcount">0</b></span><button type="button" id="msend">Enviar lista</button></div><div class="momlink" id="mlink" hidden></div>';
  for(const g of L.groups){ h += '<section class="aisle"><h3>' + g.name + '</h3><ul>'; for(const it of g.items){ h += '<li data-id="' + it.id + '" data-p="' + it.price + '"' + (it.out ? ' data-out="1"' : '') + '><label><input type="checkbox"' + (have[it.id] ? ' checked' : '') + '><span class="it"><span class="nm">' + it.name + '</span><span class="qt">' + it.qty + '</span>' + (it.buy ? '<span class="by">' + (it.out ? '' : 'Compras: ') + it.buy + '</span>' : '') + (it.out ? '<span class="tag">Cómpralo en otro súper</span>' : '') + '</span><span class="pr">' + (it.out ? '≈ ' : '') + eur(it.price) + '</span></label><button type="button" class="mama" aria-label="Pasar a la lista de mamá" aria-pressed="' + (mom[it.id] ? 'true' : 'false') + '">👩🏻</button></li>'; } h += '</ul></section>'; }
  if(L.note) h += '<p class="cfoot">' + L.note + '</p>';
  body.innerHTML = h;
  const lis = [...body.querySelectorAll('li')];
  const upd = () => { let n = 0, cost = 0, m = 0; lis.forEach(li => { const on = li.querySelector('input').checked, mm = !!mom[li.dataset.id]; li.classList.toggle('have', on); li.classList.toggle('mom', mm); if(mm) m++; if(on || mm) n++; else if(!li.dataset.out) cost += +li.dataset.p; });
    $('mcount').textContent = m === 1 ? '1 producto' : m + ' productos'; $('msend').disabled = !m;
    body.querySelectorAll('.aisle').forEach(s => s.classList.toggle('allhave', !s.querySelector('li:not(.have)')));
    const left = lis.length - n; $('cleft').textContent = left; $('clbl').textContent = (left === 1 ? 'por comprar' : 'por comprar') + ' de ' + lis.length; $('ccost').textContent = eur(cost); $('cfill').style.width = (n / lis.length * 100) + '%'; };
  const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(have)); }catch(e){} };
  lis.forEach(li => li.querySelector('input').addEventListener('change', e => { if(e.target.checked) have[li.dataset.id] = 1; else delete have[li.dataset.id]; save(); upd(); }));
  lis.forEach(li => li.querySelector('.mama').addEventListener('click', e => { const id = li.dataset.id; if(mom[id]) delete mom[id]; else mom[id] = 1; e.currentTarget.setAttribute('aria-pressed', String(!!mom[id])); try{ localStorage.setItem(MKEY, JSON.stringify(mom)); }catch(err){} $('mlink').hidden = true; upd(); }));
  $('msend').onclick = async () => { const ids = lis.map(li => li.dataset.id).filter(id => mom[id]); if(!ids.length) return;
    const url = new URL('mama.html?w=' + encodeURIComponent(w) + '&i=' + ids.join(','), location.href.split('?')[0].replace(/[^/]*$/, '')).href;
    const text = 'Mamá, esto es lo que te pido que compres: ';
    try{ if(navigator.share){ await navigator.share({ title: 'Lista de la compra', text, url }); return; } }catch(e){ if(e && e.name === 'AbortError') return; }
    try{ await navigator.clipboard.writeText(url); $('mlink').textContent = 'Enlace copiado: ' + url; }catch(e){ $('mlink').textContent = url; }
    $('mlink').hidden = false; };
  const setOnly = v => { only = v; $('conly').setAttribute('aria-pressed', String(v)); body.classList.toggle('only', v); try{ localStorage.setItem('compra-only', v ? '1' : '0'); }catch(e){} };
  $('conly').onclick = () => setOnly(!only);
  $('creset').onclick = () => { if(!confirm('¿Desmarcar todos los productos?')) return; have = {}; save(); lis.forEach(li => li.querySelector('input').checked = false); upd(); };
  setOnly(only); upd();
}

// Deslizar hacia abajo desde arriba del día recarga la app (datos y versión nueva).
(() => { let y0 = null, x0 = 0, d = 0; const ptr = $('ptr'), car = $('car');
  const show = v => { ptr.style.opacity = Math.min(1, v / 70); ptr.style.transform = 'translateY(' + (Math.min(v, 90) - 60) + 'px) rotate(' + v * 3 + 'deg)'; };
  car.addEventListener('touchstart', e => { const sl = e.target.closest('.slide'); y0 = sl && sl.scrollTop <= 0 ? e.touches[0].clientY : null; x0 = e.touches[0].clientX; d = 0; }, { passive: true });
  car.addEventListener('touchmove', e => { if(y0 === null) return; const dy = e.touches[0].clientY - y0, dx = Math.abs(e.touches[0].clientX - x0); if(dy <= 0 || dx > dy){ d = 0; show(0); return; } d = dy * 0.6; show(d); }, { passive: true });
  car.addEventListener('touchend', () => { if(y0 === null) return; y0 = null;
    if(d > 70){ ptr.classList.add('spin'); ptr.style.opacity = 1; ptr.style.transform = 'translateY(30px)'; setTimeout(() => location.reload(), 350); }
    else { ptr.style.transition = 'transform .2s, opacity .2s'; show(0); setTimeout(() => { ptr.style.transition = ''; }, 220); } });
})();
